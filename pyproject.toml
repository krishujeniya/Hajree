[project]
name = "hajree"
version = "2.0.0"
description = "Hajree - AI-Powered Smart Attendance Management Platform built with FastAPI and React."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.13.0",
    "bcrypt>=4.1.0",
    "deepface>=0.0.95",
    "email-validator>=2.1.0",
    "fastapi>=0.115.0",
    "fpdf2>=2.8.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.30",
    "tf-keras>=2.20.1",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["backend"]
exclude = ["src", "assets", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "UP006", "UP035", "UP045"]
