<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#0F0F17" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#07070A" stop-opacity="1" />
    </radialGradient>
    
    <linearGradient id="rimGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38384A" />
      <stop offset="50%" stop-color="#1E1E28" />
      <stop offset="100%" stop-color="#2D2D3F" />
    </linearGradient>

    <!-- Biometric Laser & Reticle Gradients -->
    <linearGradient id="reticleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0" />
      <stop offset="25%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>

    <!-- Metallic Platinum Core -->
    <linearGradient id="platinum" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F1F5F9" />
      <stop offset="85%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Verified Badge Gradient -->
    <linearGradient id="verifiedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Container Squircle (Apple radius 116 for 512px) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)" stroke="url(#rimGradient)" stroke-width="3" />

  <!-- Subtle Inner Ambient Mesh Glow -->
  <circle cx="256" cy="230" r="140" fill="#6366F1" opacity="0.12" filter="url(#softGlow)" />

  <!-- Corner Brackets / Biometric Reticle [ ] -->
  <!-- Top-Left -->
  <path d="M 126 182 L 126 142 A 16 16 0 0 1 142 126 L 182 126" stroke="url(#reticleGrad)" stroke-width="12" stroke-linecap="round" fill="none" />
  <!-- Top-Right -->
  <path d="M 330 126 L 370 126 A 16 16 0 0 1 386 142 L 386 182" stroke="url(#reticleGrad)" stroke-width="12" stroke-linecap="round" fill="none" />
  <!-- Bottom-Left -->
  <path d="M 126 330 L 126 370 A 16 16 0 0 0 142 386 L 182 386" stroke="url(#reticleGrad)" stroke-width="12" stroke-linecap="round" fill="none" />
  <!-- Bottom-Right -->
  <path d="M 330 386 L 370 386 A 16 16 0 0 0 386 370 L 386 330" stroke="url(#reticleGrad)" stroke-width="12" stroke-linecap="round" fill="none" />

  <!-- Biometric Face Head (Platinum Gradient) -->
  <circle cx="256" cy="208" r="54" stroke="url(#platinum)" stroke-width="15" fill="none" stroke-linecap="round" />

  <!-- Human Torso / Collar Contour -->
  <path d="M 162 358 C 162 298, 202 284, 256 284 C 310 284, 350 298, 350 358" stroke="url(#platinum)" stroke-width="15" stroke-linecap="round" fill="none" />

  <!-- Horizontal Biometric Scan Beam -->
  <line x1="148" y1="208" x2="364" y2="208" stroke="url(#scanBeam)" stroke-width="3" stroke-linecap="round" />
  <circle cx="256" cy="208" r="3.5" fill="#FFFFFF" filter="url(#softGlow)" />
  <circle cx="206" cy="208" r="2.5" fill="#818CF8" />
  <circle cx="306" cy="208" r="2.5" fill="#818CF8" />

  <!-- Verified Attendance Badge (Top-Right of Reticle) -->
  <g filter="url(#badgeGlow)">
    <circle cx="366" cy="146" r="26" fill="url(#verifiedGrad)" stroke="#09090B" stroke-width="4" />
    <path d="M 356 146 L 363.5 153.5 L 376.5 139.5" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
